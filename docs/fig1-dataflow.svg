<svg viewBox="0 0 720 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
    <style>
      .ink   { fill: #2b2f36; }
      .muted { fill: #5b6470; }
      .boxf  { fill: #eef1f5; stroke: #c4ccd6; stroke-width: 1.2; }
      .frozf { fill: #e7eef5; stroke: #9db6cf; stroke-width: 1.2; }
      .outf  { fill: #fbeee2; stroke: #d8955b; stroke-width: 1.6; }
      .eq    { font-size: 17px; font-style: italic; }
      .eqs   { font-size: 12px; }
      .lbl   { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
      .step  { font-size: 10.5px; font-weight: 700; letter-spacing: 0.1em; }
      .flow  { stroke: #5b6470; stroke-width: 1.4; fill: none; }
      sub    { font-size: 0.72em; baseline-shift: -0.25em; }
    </style>
  </defs>

  <!-- title -->
  <text x="30" y="34" class="ink" font-size="15" font-weight="700">Figure 1 — One particle, one tick: acceleration → velocity → position</text>
  <text x="30" y="52" class="muted" font-size="11">Per §Part 1, Steps 3–5 · softened form · direction convention: source − self · scene: see Fig 0</text>

  <!-- INPUT box: net acceleration -->
  <rect x="235" y="80" width="250" height="52" rx="7" class="outf"/>
  <g class="ink">
    <text x="326" y="104" class="eq" text-anchor="start">a<tspan class="eqs" dy="4">i</tspan><tspan dy="-4"> = ( a</tspan><tspan class="eqs" dy="4">x</tspan><tspan dy="-4"> , a</tspan><tspan class="eqs" dy="4">y</tspan><tspan dy="-4"> )</tspan></text>
    <line x1="326" y1="86" x2="339" y2="86" stroke="#2b2f36" stroke-width="1.2"/>
    <path d="M339,86 l-3.5,-2.2 M339,86 l-3.5,2.2" stroke="#2b2f36" stroke-width="1.2" fill="none"/>
  </g>
  <text x="360" y="122" class="muted" font-size="10" text-anchor="middle">net acceleration (from Step 7 sum)</text>

  <!-- split to two columns -->
  <path class="flow" d="M360,132 L360,150 M240,150 L480,150 M240,150 L240,168 M480,150 L480,168" marker-end="url(#arrow1)"/>
  <path class="flow" d="M240,150 L240,172" marker-end="url(#arrow1)"/>
  <path class="flow" d="M480,150 L480,172" marker-end="url(#arrow1)"/>

  <text x="150" y="164" class="muted step">X COMPONENT</text>
  <text x="512" y="164" class="muted step">Y COMPONENT</text>

  <!-- Step 4: velocity -->
  <rect x="120" y="176" width="240" height="56" rx="7" class="boxf"/>
  <text x="240" y="200" class="ink eq" text-anchor="middle">v<tspan class="eqs" dy="4">x</tspan><tspan dy="-4"> = v</tspan><tspan class="eqs" dy="4">x,0</tspan><tspan dy="-4"> + a</tspan><tspan class="eqs" dy="4">x</tspan><tspan dy="-4"> dt</tspan></text>
  <text x="240" y="221" class="muted lbl" text-anchor="middle">Step 4 · update velocity</text>

  <rect x="360" y="176" width="240" height="56" rx="7" class="boxf"/>
  <text x="480" y="200" class="ink eq" text-anchor="middle">v<tspan class="eqs" dy="4">y</tspan><tspan dy="-4"> = v</tspan><tspan class="eqs" dy="4">y,0</tspan><tspan dy="-4"> + a</tspan><tspan class="eqs" dy="4">y</tspan><tspan dy="-4"> dt</tspan></text>
  <text x="480" y="221" class="muted lbl" text-anchor="middle">Step 4 · update velocity</text>

  <!-- arrows down, carrying NEW velocity -->
  <path class="flow" d="M240,232 L240,266" marker-end="url(#arrow1)"/>
  <path class="flow" d="M480,232 L480,266" marker-end="url(#arrow1)"/>
  <text x="252" y="252" class="muted" font-size="9.5" font-style="italic">new v&#8339;</text>
  <text x="492" y="252" class="muted" font-size="9.5" font-style="italic">new v&#7527;</text>

  <!-- Step 5: position -->
  <rect x="120" y="270" width="240" height="56" rx="7" class="boxf"/>
  <text x="240" y="294" class="ink eq" text-anchor="middle">x = x<tspan class="eqs" dy="4">0</tspan><tspan dy="-4"> + v</tspan><tspan class="eqs" dy="4">x</tspan><tspan dy="-4"> dt</tspan></text>
  <text x="240" y="315" class="muted lbl" text-anchor="middle">Step 5 · update position</text>

  <rect x="360" y="270" width="240" height="56" rx="7" class="boxf"/>
  <text x="480" y="294" class="ink eq" text-anchor="middle">y = y<tspan class="eqs" dy="4">0</tspan><tspan dy="-4"> + v</tspan><tspan class="eqs" dy="4">y</tspan><tspan dy="-4"> dt</tspan></text>
  <text x="480" y="315" class="muted lbl" text-anchor="middle">Step 5 · update position</text>

  <!-- merge to result -->
  <path class="flow" d="M240,326 L240,352 L340,352" fill="none"/>
  <path class="flow" d="M480,326 L480,352 L380,352" fill="none"/>
  <path class="flow" d="M360,352 L360,372" marker-end="url(#arrow1)"/>

  <!-- OUTPUT -->
  <rect x="285" y="376" width="150" height="46" rx="7" class="outf"/>
  <text x="360" y="404" class="ink eq" text-anchor="middle" font-size="19">( x<tspan class="eqs" dy="4">i</tspan><tspan dy="-4"> , y</tspan><tspan class="eqs" dy="4">i</tspan><tspan dy="-4"> )</tspan></text>

  <!-- ordering callout -->
  <rect x="120" y="446" width="480" height="42" rx="6" fill="#f6f0e8" stroke="#e0cba8" stroke-width="1"/>
  <text x="134" y="464" class="ink" font-size="10.5" font-weight="700">Normative ordering (Step 5):</text>
  <text x="134" y="479" class="muted" font-size="10.5">position uses the velocity Step 4 just wrote — semi-implicit Euler. Reversing keeps energy bounded vs. injected.</text>

  <!-- legend -->
  <g transform="translate(120,80)">
    <rect x="-0" y="0" width="12" height="12" rx="2" class="outf"/>
    <text x="18" y="10" class="muted" font-size="9.5">result / output</text>
    <rect x="0" y="16" width="12" height="12" rx="2" class="boxf"/>
    <text x="18" y="26" class="muted" font-size="9.5">update rule</text>
  </g>
</svg>
