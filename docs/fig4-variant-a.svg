<svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="dn" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,0 L5,10 z" fill="#6b7480"/>
    </marker>
    <style>
      .ink{fill:#2b2f36;} .muted{fill:#5b6470;}
      .mono{font-family:'SF Mono','Consolas','Menlo',monospace;}
      .reg{fill:#eef1f5;stroke:#c4ccd6;stroke-width:1;}
      .bcast{fill:#fbeee2;stroke:#d8955b;stroke-width:1.3;}
      .load{fill:#dcebf6;stroke:#9db6cf;stroke-width:1.3;}
      .acc{fill:#e9f0e6;stroke:#9cb98a;stroke-width:1.3;}
      .op{fill:#5b6470;}
    </style>
  </defs>

  <text x="30" y="34" class="ink" font-size="15" font-weight="700">Figure 4 — Variant A: one target particle i vs. L sources per instruction (§3.3)</text>
  <text x="30" y="52" class="muted" font-size="11">Signature of Variant A: broadcast the target, vector-load the sources. L = 8 lanes shown (256-bit / 32-bit).</text>

  <!-- lane column headers -->
  <g transform="translate(120,74)" class="mono" font-size="8.5" fill="#8a929c" text-anchor="middle">
    <text x="35"  y="0">lane 0</text><text x="105" y="0">1</text><text x="175" y="0">2</text><text x="245" y="0">3</text>
    <text x="315" y="0">4</text><text x="385" y="0">5</text><text x="455" y="0">6</text><text x="525" y="0">7</text>
  </g>

  <!-- ROW 1: broadcast xi -->
  <text x="30" y="100" class="mono" font-size="10.5" fill="#c8752f">@splat(x[i])</text>
  <g transform="translate(120,86)" class="mono" font-size="10" text-anchor="middle">
    <rect class="bcast" x="0"   y="0" width="70" height="26"/><text x="35"  y="17">x&#7522;</text>
    <rect class="bcast" x="70"  y="0" width="70" height="26"/><text x="105" y="17">x&#7522;</text>
    <rect class="bcast" x="140" y="0" width="70" height="26"/><text x="175" y="17">x&#7522;</text>
    <rect class="bcast" x="210" y="0" width="70" height="26"/><text x="245" y="17">x&#7522;</text>
    <rect class="bcast" x="280" y="0" width="70" height="26"/><text x="315" y="17">x&#7522;</text>
    <rect class="bcast" x="350" y="0" width="70" height="26"/><text x="385" y="17">x&#7522;</text>
    <rect class="bcast" x="420" y="0" width="70" height="26"/><text x="455" y="17">x&#7522;</text>
    <rect class="bcast" x="490" y="0" width="70" height="26"/><text x="525" y="17">x&#7522;</text>
  </g>
  <text x="30" y="114" class="muted" font-size="8.5">all lanes equal</text>

  <!-- minus sign -->
  <text x="90" y="138" class="op mono" font-size="16" text-anchor="middle">&#8722;</text>

  <!-- ROW 2: load 8 sources -->
  <text x="30" y="140" class="mono" font-size="10.5" fill="#5378a0">x[j..][0..8]</text>
  <g transform="translate(120,126)" class="mono" font-size="10" text-anchor="middle">
    <rect class="load" x="0"   y="0" width="70" height="26"/><text x="35"  y="17">x&#7522;</text>
    <rect class="load" x="70"  y="0" width="70" height="26"/><text x="105" y="17">x&#11002;</text>
    <rect class="load" x="140" y="0" width="70" height="26"/><text x="175" y="17">x&#8343;</text>
    <rect class="load" x="210" y="0" width="70" height="26"/><text x="245" y="17">x&#8341;</text>
    <rect class="load" x="280" y="0" width="70" height="26"/><text x="315" y="17">x&#7580;</text>
    <rect class="load" x="350" y="0" width="70" height="26"/><text x="385" y="17">x&#11003;</text>
    <rect class="load" x="420" y="0" width="70" height="26"/><text x="455" y="17">x&#7495;</text>
    <rect class="load" x="490" y="0" width="70" height="26"/><text x="525" y="17">x&#8336;</text>
  </g>
  <text x="30" y="154" class="muted" font-size="8.5">8 sources</text>

  <!-- SUB arrow -->
  <line x1="400" y1="156" x2="400" y2="178" stroke="#6b7480" stroke-width="1.4" marker-end="url(#dn)"/>
  <text x="415" y="172" class="mono muted" font-size="10">1 SUB &#8594; all 8 dx at once</text>

  <!-- ROW 3: dx result -->
  <text x="30" y="196" class="mono muted" font-size="10.5">dx (vector)</text>
  <g transform="translate(120,182)" class="mono" font-size="9" text-anchor="middle">
    <rect class="reg" x="0"   y="0" width="70" height="24"/><text x="35"  y="16">dx&#7522;&#11002;</text>
    <rect class="reg" x="70"  y="0" width="70" height="24"/><text x="105" y="16">dx&#7522;&#8343;</text>
    <rect class="reg" x="140" y="0" width="70" height="24"/><text x="175" y="16">dx&#7522;&#8341;</text>
    <rect class="reg" x="210" y="0" width="70" height="24"/><text x="245" y="16">&#8230;</text>
    <rect class="reg" x="280" y="0" width="70" height="24"/><text x="315" y="16">&#8230;</text>
    <rect class="reg" x="350" y="0" width="70" height="24"/><text x="385" y="16">&#8230;</text>
    <rect class="reg" x="420" y="0" width="70" height="24"/><text x="455" y="16">&#8230;</text>
    <rect class="reg" x="490" y="0" width="70" height="24"/><text x="525" y="16">dx&#7522;&#8336;</text>
  </g>

  <!-- middle note -->
  <text x="360" y="238" class="muted" font-size="10" text-anchor="middle" font-style="italic">&#8230; the other 13 ops (MUL, ADD, SQRT, DIV) run the same way, elementwise, staying in registers &#8230;</text>

  <!-- ROW 4: accumulators -->
  <text x="30" y="272" class="mono" font-size="10.5" fill="#6b8a56">axv += ...</text>
  <g transform="translate(120,258)" class="mono" font-size="8.5" text-anchor="middle">
    <rect class="acc" x="0"   y="0" width="70" height="24"/><text x="35"  y="16">&#931; lane 0</text>
    <rect class="acc" x="70"  y="0" width="70" height="24"/><text x="105" y="16">&#931; lane 1</text>
    <rect class="acc" x="140" y="0" width="70" height="24"/><text x="175" y="16">&#931; lane 2</text>
    <rect class="acc" x="210" y="0" width="70" height="24"/><text x="245" y="16">&#931; lane 3</text>
    <rect class="acc" x="280" y="0" width="70" height="24"/><text x="315" y="16">&#931; lane 4</text>
    <rect class="acc" x="350" y="0" width="70" height="24"/><text x="385" y="16">&#931; lane 5</text>
    <rect class="acc" x="420" y="0" width="70" height="24"/><text x="455" y="16">&#931; lane 6</text>
    <rect class="acc" x="490" y="0" width="70" height="24"/><text x="525" y="16">&#931; lane 7</text>
  </g>
  <text x="30" y="286" class="muted" font-size="8.5">L partial sums</text>
  <text x="120" y="300" class="muted" font-size="9">lane 0 accumulates sources 0, 8, 16, &#8230; — the inner loop strides by L over all sources</text>

  <!-- reduce -->
  <line x1="400" y1="306" x2="400" y2="330" stroke="#6b7480" stroke-width="1.4" marker-end="url(#dn)"/>
  <text x="415" y="322" class="mono muted" font-size="10">@reduce(.Add, axv) &#8212; the one horizontal step</text>

  <!-- final scalar -->
  <rect x="300" y="334" width="200" height="34" rx="6" class="bcast"/>
  <text x="400" y="356" class="ink mono" font-size="12" text-anchor="middle">ax[i] , ay[i]</text>

  <!-- legend -->
  <g transform="translate(30,392)" font-size="9.5">
    <rect class="bcast" x="0" y="0" width="12" height="12" rx="2"/><text x="18" y="10" class="muted">broadcast target (@splat)</text>
    <rect class="load" x="170" y="0" width="12" height="12" rx="2"/><text x="188" y="10" class="muted">vector-loaded sources</text>
    <rect class="acc" x="330" y="0" width="12" height="12" rx="2"/><text x="348" y="10" class="muted">lane accumulators</text>
  </g>

  <!-- caption -->
  <rect x="30" y="416" width="630" height="50" rx="6" fill="#f6f0e8" stroke="#e0cba8" stroke-width="1"/>
  <text x="45" y="436" class="ink" font-size="10.5" font-weight="700">Why the reduce matters (§3.5):</text>
  <text x="45" y="452" class="muted" font-size="10.5">Summing lanes reorders Step 7's addition vs. the scalar build. Float addition isn't associative, so results differ in the</text>
  <text x="45" y="464" class="muted" font-size="10.5">last bits — which is exactly why the scalar-vs-SIMD comparison is tolerance-based, not bitwise.</text>
</svg>
