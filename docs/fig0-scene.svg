<svg viewBox="0 0 420 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ax0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a929c"/>
    </marker>
    <style>
      .ink{fill:#2b2f36;} .muted{fill:#5b6470;}
      .axis{stroke:#8a929c;stroke-width:1.2;}
      .grid{stroke:#e4e8ee;stroke-width:1;}
      .src{fill:#e7eef5;stroke:#9db6cf;stroke-width:1.3;}
      .self{fill:#fbeee2;stroke:#d8955b;stroke-width:1.8;}
      .plbl{font-size:11px;font-style:italic;}
      .mlbl{font-size:9.5px;}
    </style>
  </defs>

  <text x="24" y="28" class="ink" font-size="14" font-weight="700">Figure 0 — The scene: particle i and its sources</text>
  <text x="24" y="45" class="muted" font-size="10.5">Shared setup for Figures 1–2 · positions on an x–y plane, masses labeled</text>

  <!-- gridlines -->
  <g class="grid">
    <line x1="97"  y1="90" x2="97"  y2="360"/>
    <line x1="151" y1="90" x2="151" y2="360"/>
    <line x1="205" y1="90" x2="205" y2="360"/>
    <line x1="259" y1="90" x2="259" y2="360"/>
    <line x1="313" y1="90" x2="313" y2="360"/>
    <line x1="70"  y1="117" x2="340" y2="117"/>
    <line x1="70"  y1="171" x2="340" y2="171"/>
    <line x1="70"  y1="225" x2="340" y2="225"/>
    <line x1="70"  y1="279" x2="340" y2="279"/>
    <line x1="70"  y1="333" x2="340" y2="333"/>
  </g>

  <!-- axes -->
  <line class="axis" x1="70" y1="360" x2="352" y2="360" marker-end="url(#ax0)"/>
  <line class="axis" x1="70" y1="360" x2="70"  y2="78"  marker-end="url(#ax0)"/>
  <text x="356" y="364" class="muted" font-size="11" font-style="italic">x</text>
  <text x="64"  y="76"  class="muted" font-size="11" font-style="italic">y</text>

  <!-- sources -->
  <g text-anchor="middle">
    <circle class="src" cx="129" cy="133" r="10"/><text x="129" y="137" class="ink plbl">a</text>
    <text x="129" y="119" class="muted mlbl">m=9</text>

    <circle class="src" cx="302" cy="166" r="10"/><text x="302" y="170" class="ink plbl">b</text>
    <text x="302" y="152" class="muted mlbl">m=8</text>

    <circle class="src" cx="281" cy="252" r="10"/><text x="281" y="256" class="ink plbl">c</text>
    <text x="281" y="238" class="muted mlbl">m=10</text>

    <circle class="src" cx="205" cy="317" r="10"/><text x="205" y="321" class="ink plbl">d</text>
    <text x="205" y="303" class="muted mlbl">m=3</text>

    <circle class="src" cx="108" cy="209" r="10"/><text x="108" y="213" class="ink plbl">e</text>
    <text x="108" y="195" class="muted mlbl">m=6</text>

    <!-- particle i (highlighted) -->
    <circle class="self" cx="151" cy="279" r="11"/><text x="151" y="283" class="ink plbl">i</text>
    <text x="151" y="303" class="muted mlbl" font-weight="700">m=5</text>
  </g>
</svg>
